:root{color-scheme:light;--ink:#171717;--muted:#6b7280;--line:#e7e7e7;--soft:#f6f6f4;--green:#137a4b}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:29px;letter-spacing:.2px}
.checkout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);max-width:1180px;margin:0 auto;min-height:calc(100vh - 74px)}
.pay{padding:46px 64px 70px 34px;border-right:1px solid var(--line)}
.summary{padding:46px 34px 70px 64px;background:#faf9f7}
.eyebrow{font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:#777;margin:0 0 8px}
h1{font-size:27px;line-height:1.15;margin:0 0 8px}h2{font-size:19px;margin:0 0 22px}
.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 26px}
.notice{border:1px solid #dedede;background:#fbfbfb;border-radius:12px;padding:18px;line-height:1.5;font-size:14px}
.notice strong{display:block;margin-bottom:4px}.notice.preview{border-style:dashed}
.whop{min-height:510px}.secure{font-size:13px;color:var(--muted);margin:18px 0 0;display:flex;gap:8px;align-items:center}
.back{display:inline-block;margin-top:22px;font-size:13px;text-underline-offset:3px}
.product{display:grid;grid-template-columns:78px 1fr;gap:15px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.image{width:78px;height:78px;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}.image img{width:100%;height:100%;object-fit:cover}
.product-name{font-weight:700;font-size:14px;margin:2px 0 6px}.variant{font-size:13px;color:var(--muted);line-height:1.5}
.items{padding:18px 0;border-bottom:1px solid var(--line)}.item{display:grid;grid-template-columns:1fr auto;gap:16px;padding:8px 0;font-size:14px}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.rows{padding:20px 0;border-bottom:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:18px;margin:0 0 11px;font-size:14px}.row:last-child{margin-bottom:0}.save{color:var(--green)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 8px}.total strong{font-size:17px}.amount{font-size:26px;font-weight:760}.currency{font-size:12px;color:var(--muted);margin-right:6px}
.fine{font-size:12px;color:var(--muted);line-height:1.55;margin-top:18px}
.success-wrap{min-height:100vh;background:#f7f7f5;padding:42px 18px}.success{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.05)}
.success-head{padding:38px 38px 28px;border-bottom:1px solid var(--line)}.check{width:48px;height:48px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:23px;margin-bottom:18px}
.status{color:var(--green);font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.07em}.success-body{padding:30px 38px 38px}
.success-product{display:grid;grid-template-columns:68px 1fr auto;gap:14px;align-items:start;padding-bottom:22px;border-bottom:1px solid var(--line)}
.success-product .image{width:68px;height:68px}.success-product .price{font-weight:700;font-size:14px}
.pending{background:#f5f5f3;border-radius:12px;padding:15px 16px;font-size:13px;line-height:1.55;margin-top:24px;color:#505050}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border-radius:9px;background:#111;color:#fff;text-decoration:none;font-weight:700;font-size:14px}.btn.secondary{background:#fff;color:#111;border:1px solid #ccc}
.error{max-width:620px;margin:80px auto;padding:0 20px}.error-card{border:1px solid #e5e5e5;border-radius:16px;padding:32px}
@media(max-width:880px){.checkout{grid-template-columns:1fr}.summary{order:-1;padding:24px 20px;border-bottom:1px solid var(--line)}.pay{padding:30px 20px 54px;border-right:0}.top{height:64px}.brand{font-size:25px}}
@media(max-width:520px){.success-head,.success-body{padding-left:22px;padding-right:22px}.success-product{grid-template-columns:58px 1fr}.success-product .image{width:58px;height:58px}.success-product .price{grid-column:2}.amount{font-size:23px}}
